<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT APRS Monitor</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:#101418;color:#e8edf2} header{padding:18px 24px;background:#171c21;border-bottom:1px solid #2a323a}
h1{margin:0;font-size:1.35rem}.sub{color:#9ca8b3;font-size:.9rem;margin-top:4px} main{padding:18px 24px;max-width:1600px;margin:auto}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.card{background:#171c21;border:1px solid #2a323a;border-radius:8px;padding:10px 14px;min-width:140px}
.label{color:#9ca8b3;font-size:.76rem}.value{font-size:1.15rem;font-weight:600;margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#777}.live{background:#35c46a}
.map{height:480px;background:#222;border:1px solid #2a323a;border-radius:8px;overflow:hidden;position:relative;margin-bottom:14px}
#map{width:100%;height:100%;position:relative;overflow:hidden;background:#20262b}.tiles{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;image-rendering:auto}
.marker{position:absolute;transform:translate(-50%,-100%);font:700 11px ui-monospace,monospace;white-space:nowrap}.pin{display:block;width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#4aa3df;border:2px solid #fff;box-sizing:border-box;margin:auto}.labeltxt{background:#101418dd;padding:2px 4px;border-radius:3px;margin-top:2px;display:inline-block}
.mapmsg{position:absolute;left:10px;top:10px;background:#101418dd;padding:6px 8px;border-radius:4px;color:#9ca8b3;font-size:.8rem;z-index:10}
.table-wrap{overflow:auto;background:#171c21;border:1px solid #2a323a;border-radius:8px} table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #252c33;vertical-align:top} th{font-size:.78rem;color:#9ca8b3;position:sticky;top:0;background:#171c21}
td{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}.payload{white-space:pre-wrap;word-break:break-word;max-width:650px}
footer{color:#7f8a94;font-size:.78rem;margin-top:10px}button{background:#252d35;color:#e8edf2;border:1px solid #3a4650;border-radius:5px;padding:7px 11px;cursor:pointer}
</style>
</head>
<body>
<header><h1>📡 TT APRS Monitor</h1><div class="sub"><span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span></div></header>
<main>
<section class="cards">
<div class="card"><div class="label">Packets stored</div><div id="total" class="value">—</div></div>
<div class="card"><div class="label">Showing</div><div id="shown" class="value">—</div></div>
<div class="card"><div class="label">Frequency</div><div id="frequency" class="value">—</div></div>
<div class="card"><div class="label">Positions</div><div id="positions" class="value">—</div></div>
<div class="card"><div class="label">Last packet</div><div id="last" class="value">—</div></div>
<button id="refresh">Refresh</button>
</section>
<div class="map"><div id="map"><div class="tiles"></div></div><div class="mapmsg">Offline map · local MBTiles</div></div>
<div class="table-wrap"><table><thead><tr><th>Time</th><th>From</th><th>To</th><th>Path</th><th>Payload</th></tr></thead><tbody id="packets"><tr><td colspan="5">Loading…</td></tr></tbody></table></div>
<footer>Auto-refresh: 5 seconds · Receive-only local APRS monitor</footer>
</main>
<script>
const fmtTime=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()};
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function position(payload){
  // APRS uncompressed or common compressed positions are intentionally handled only for
  // standard uncompressed DDMM.hhN/DDDMM.hhW style payloads here.
  const m=String(payload||"").match(/[!=\/][A-Z]?([0-9]{2})([0-9]{2}\.[0-9]{2})([NS])[\/ ]([0-9]{3})([0-9]{2}\.[0-9]{2})([EW])/);
  if(!m)return null;
  let lat=Number(m[1])+Number(m[2])/60,lon=Number(m[4])+Number(m[5])/60;
  if(m[3]==="S")lat=-lat;if(m[6]==="W")lon=-lon;
  return {lat,lon};
}
const mapEl=document.querySelector("#map"), tilesEl=document.querySelector(".tiles");
let mapCenter={lat:32.22,lon:-110.97}, zoom=9;
function project(lat,lon,z){const n=2**z,x=(lon+180)/360*n,y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n;return{x:x*256,y:y*256}}
function renderMap(points){
  if(points.length){mapCenter={lat:points.reduce((a,p)=>a+p.lat,0)/points.length,lon:points.reduce((a,p)=>a+p.lon,0)/points.length}}
  const z=zoom, c=project(mapCenter.lat,mapCenter.lon,z), w=mapEl.clientWidth,h=mapEl.clientHeight, left=c.x-w/2,top=c.y-h/2;
  tilesEl.innerHTML="";
  const tx0=Math.floor(left/256),ty0=Math.floor(top/256),tx1=Math.floor((left+w)/256),ty1=Math.floor((top+h)/256),n=2**z;
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const img=document.createElement("img");img.className="tile";img.src="/tiles/"+z+"/"+((tx%n+n)%n)+"/"+Math.max(0,Math.min(n-1,ty))+".png";img.style.left=(tx*256-left)+"px";img.style.top=(ty*256-top)+"px";tilesEl.appendChild(img)}
  document.querySelectorAll(".marker").forEach(x=>x.remove());
  points.forEach(p=>{const q=project(p.lat,p.lon,z),d=document.createElement("div");d.className="marker";d.style.left=(q.x-left)+"px";d.style.top=(q.y-top)+"px";d.innerHTML='<span class="pin"></span><span class="labeltxt">'+escapeHtml(p.call)+'</span>';mapEl.appendChild(d)})
}
async function load(){
 try{
  const [health,data]=await Promise.all([fetch("/api/health",{cache:"no-store"}).then(r=>r.json()),fetch("/api/packets?limit=100",{cache:"no-store"}).then(r=>r.json())]);
  document.querySelector("#dot").className="dot live";document.querySelector("#status").textContent="LIVE";
  document.querySelector("#total").textContent=health.packets_stored??"—";document.querySelector("#frequency").textContent=health.frequency??"—";document.querySelector("#shown").textContent=data.count??0;
  const rows=data.packets||[], pts=rows.map(p=>{const x=position(p.payload);return x?{...x,call:p.from_callsign}:null}).filter(Boolean);
  document.querySelector("#positions").textContent=pts.length;document.querySelector("#last").textContent=rows.length?fmtTime(rows[0].received_at):"None";renderMap(pts);
  document.querySelector("#packets").innerHTML=rows.length?rows.map(p=>`<tr><td>${escapeHtml(fmtTime(p.received_at))}</td><td>${escapeHtml(p.from_callsign)}</td><td>${escapeHtml(p.to_callsign||"")}</td><td>${escapeHtml(p.path||"")}</td><td class="payload">${escapeHtml(p.payload)}</td></tr>`).join(""):'<tr><td colspan="5">No packets received yet.</td></tr>';
 }catch(e){document.querySelector("#dot").className="dot";document.querySelector("#status").textContent="API unavailable"}
}
document.querySelector("#refresh").addEventListener("click",load);window.addEventListener("resize",()=>load());load();setInterval(load,5000);
</script>
</body></html>
