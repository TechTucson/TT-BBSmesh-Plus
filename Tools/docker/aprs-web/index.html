<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT APRS Monitor</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:#101418;color:#e8edf2}
header{padding:20px 24px;background:#171c21;border-bottom:1px solid #2a323a}
h1{margin:0;font-size:1.35rem}.sub{color:#9ca8b3;font-size:.9rem;margin-top:4px}
main{padding:20px 24px;max-width:1600px;margin:auto}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:#171c21;border:1px solid #2a323a;border-radius:8px;padding:12px 16px;min-width:150px}
.label{color:#9ca8b3;font-size:.78rem}.value{font-size:1.25rem;font-weight:600;margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#777}.live{background:#35c46a}
.table-wrap{overflow:auto;background:#171c21;border:1px solid #2a323a;border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #252c33;vertical-align:top}
th{font-size:.78rem;color:#9ca8b3;position:sticky;top:0;background:#171c21}
td{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.payload{white-space:pre-wrap;word-break:break-word;max-width:650px}
footer{color:#7f8a94;font-size:.78rem;margin-top:10px}
button{background:#252d35;color:#e8edf2;border:1px solid #3a4650;border-radius:5px;padding:7px 11px;cursor:pointer}
button:hover{background:#303a44}
</style>
</head>
<body>
<header>
  <h1>📡 TT APRS Monitor</h1>
  <div class="sub"><span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span></div>
</header>
<main>
  <section class="cards">
    <div class="card"><div class="label">Packets stored</div><div id="total" class="value">—</div></div>
    <div class="card"><div class="label">Showing</div><div id="shown" class="value">—</div></div>
    <div class="card"><div class="label">Frequency</div><div id="frequency" class="value">—</div></div>
    <div class="card"><div class="label">Last packet</div><div id="last" class="value">—</div></div>
    <button id="refresh">Refresh</button>
  </section>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Time</th><th>From</th><th>To</th><th>Path</th><th>Payload</th></tr></thead>
      <tbody id="packets"><tr><td colspan="5">Loading…</td></tr></tbody>
    </table>
  </div>
  <footer>Auto-refresh: 5 seconds · Receive-only local APRS monitor</footer>
</main>
<script>
const fmtTime = value => {
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
};
async function load() {
  try {
    const [health, data] = await Promise.all([
      fetch("/api/health", {cache:"no-store"}).then(r => r.json()),
      fetch("/api/packets?limit=100", {cache:"no-store"}).then(r => r.json())
    ]);
    document.querySelector("#dot").className = "dot live";
    document.querySelector("#status").textContent = "LIVE";
    document.querySelector("#total").textContent = health.packets_stored ?? "—";
    document.querySelector("#frequency").textContent = health.frequency ?? "—";
    document.querySelector("#shown").textContent = data.count ?? 0;
    const rows = data.packets || [];
    document.querySelector("#last").textContent = rows.length ? fmtTime(rows[0].received_at) : "None";
    document.querySelector("#packets").innerHTML = rows.length ? rows.map(p => `
      <tr>
        <td>${escapeHtml(fmtTime(p.received_at))}</td>
        <td>${escapeHtml(p.from_callsign)}</td>
        <td>${escapeHtml(p.to_callsign || "")}</td>
        <td>${escapeHtml(p.path || "")}</td>
        <td class="payload">${escapeHtml(p.payload)}</td>
      </tr>`).join("") : '<tr><td colspan="5">No packets received yet.</td></tr>';
  } catch (e) {
    document.querySelector("#dot").className = "dot";
    document.querySelector("#status").textContent = "API unavailable";
  }
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
document.querySelector("#refresh").addEventListener("click", load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
