<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT APRS Monitor</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:#101418;color:#e8edf2}header{padding:18px 24px;background:#171c21;border-bottom:1px solid #2a323a}
h1{margin:0;font-size:1.35rem}.sub{color:#9ca8b3;font-size:.9rem;margin-top:4px}main{padding:18px 24px;max-width:1600px;margin:auto}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.card{background:#171c21;border:1px solid #2a323a;border-radius:8px;padding:10px 14px;min-width:140px}
.label{color:#9ca8b3;font-size:.76rem}.value{font-size:1.15rem;font-weight:600;margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#777}.live{background:#35c46a}
.map{height:480px;background:#222;border:1px solid #2a323a;border-radius:8px;overflow:hidden;position:relative;margin-bottom:14px}
#map{width:100%;height:100%}.mapmsg{position:absolute;left:10px;top:10px;background:#101418dd;padding:6px 8px;border-radius:4px;color:#9ca8b3;font-size:.8rem;z-index:10;pointer-events:none}
.marker{font:700 11px ui-monospace,monospace;white-space:nowrap}.marker-label{background:#101418dd;color:#e8edf2;padding:2px 4px;border-radius:3px;margin-left:6px;vertical-align:top}
.table-wrap{overflow:auto;background:#171c21;border:1px solid #2a323a;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #252c33;vertical-align:top}th{font-size:.78rem;color:#9ca8b3;position:sticky;top:0;background:#171c21}
td{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}.payload{white-space:pre-wrap;word-break:break-word;max-width:650px}
footer{color:#7f8a94;font-size:.78rem;margin-top:10px}button{background:#252d35;color:#e8edf2;border:1px solid #3a4650;border-radius:5px;padding:7px 11px;cursor:pointer}
.maplibregl-ctrl-group{background:#171c21}.maplibregl-ctrl button{filter:invert(1)}
</style>
</head>
<body>
<header><h1>📡 TT APRS Monitor</h1><div class="sub"><span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span></div></header>
<main>
<section class="cards">
<div class="card"><div class="label">Packets stored</div><div id="total" class="value">—</div></div>
<div class="card"><div class="label">Showing</div><div id="shown" class="value">—</div></div>
<div class="card"><div class="label">Frequency</div><div id="frequency" class="value">—</div></div>
<div class="card"><div class="label">Positions</div><div id="positions" class="value">—</div></div>
<div class="card"><div class="label">Last packet</div><div id="last" class="value">—</div></div>
<button id="refresh">Refresh</button>
</section>
<div class="map"><div id="map"></div><div class="mapmsg">Offline Shortbread map · local MBTiles</div></div>
<div class="table-wrap"><table><thead><tr><th>Time</th><th>From</th><th>To</th><th>Path</th><th>Payload</th></tr></thead><tbody id="packets"><tr><td colspan="5">Loading…</td></tr></tbody></table></div>
<footer>Auto-refresh: 5 seconds · Receive-only local APRS monitor · Map data © OpenStreetMap contributors / Geofabrik</footer>
</main>
<script src="/vendor/maplibre-gl.js"></script>
<script>
const fmtTime=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()};
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function position(payload){
  const s=String(payload||"");

  // APRS uncompressed position:
  // !DDMM.mmN/DDDMM.mmE
  // =DDMM.mmN/DDDMM.mmE
  // /DDMM.mmN/DDDMM.mmE
  // @timestampDDMM.mmN/DDDMM.mmE
  const m=s.match(
    /[!=\/@](?:[0-9]{6}z)?([0-9]{2})([0-9]{2}\.[0-9]{2})([NS])([\/\\S])([0-9]{3})([0-9]{2}\.[0-9]{2})([EW])/
  );

  if(!m)return null;

  let lat=Number(m[1])+Number(m[2])/60;
  let lon=Number(m[5])+Number(m[6])/60;

  if(m[3]==="S")lat=-lat;
  if(m[7]==="W")lon=-lon;

  return{lat,lon};
}

const style={
  version:8,
  name:"TT APRS Shortbread",
  sources:{shortbread:{type:"vector",tiles:[`${window.location.origin}/tiles/{z}/{x}/{y}.pbf`],minzoom:0,maxzoom:14}},
  layers:[
    {id:"background",type:"background",paint:{"background-color":"#f2efe9"}},
    {id:"ocean",type:"fill",source:"shortbread","source-layer":"ocean",paint:{"fill-color":"#aad3df"}},
    {id:"water",type:"fill",source:"shortbread","source-layer":"water_polygons",paint:{"fill-color":"#aad3df"}},
    {id:"buildings",type:"fill",source:"shortbread","source-layer":"buildings",minzoom:13,paint:{"fill-color":"#d9d0c9","fill-opacity":0.65}},
    {id:"boundaries",type:"line",source:"shortbread","source-layer":"boundaries",paint:{"line-color":"#8d618b","line-width":1}},
    {id:"streets",type:"line",source:"shortbread","source-layer":"streets",paint:{}} 
  ]
};
style.layers[5].paint["line-color"]=["match",["get","kind"],"motorway","#e66e89",["trunk","primary","secondary"],"#f4c37d","#ccccca"];
style.layers[5].paint["line-width"]=["interpolate",["linear"],["zoom"],5,0.5,10,1.5,14,3];

const map=new maplibregl.Map({
  container:"map",
  style,
  center:[-110.97,32.22],
  zoom:9,
  attributionControl:{compact:true,customAttribution:'<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a> / Geofabrik'}
});
map.addControl(new maplibregl.NavigationControl(),"top-right");

let markerSource=null;
function updateMarkers(points){
  if(markerSource){
    markerSource.clearLayers();
    return;
  }
}
function setMarkers(points){
  document.querySelectorAll(".marker").forEach(e=>e.remove());
  points.forEach(p=>{
    const el=document.createElement("div");
    el.className="marker";
    el.innerHTML='<span style="display:inline-block;width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#4aa3df;border:2px solid #fff;box-sizing:border-box"></span><span class="marker-label">'+escapeHtml(p.call)+'</span>';
    new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([p.lon,p.lat]).addTo(map);
  });
  if(points.length){
    const bounds=new maplibregl.LngLatBounds();
    points.forEach(p=>bounds.extend([p.lon,p.lat]));
    map.fitBounds(bounds,{padding:70,maxZoom:12,duration:400});
  }
}

async function load(){
 try{
  const [health,data]=await Promise.all([
    fetch("/api/health",{cache:"no-store"}).then(r=>r.json()),
    fetch("/api/packets?limit=100",{cache:"no-store"}).then(r=>r.json())
  ]);
  document.querySelector("#dot").className="dot live";
  document.querySelector("#status").textContent="LIVE";
  document.querySelector("#total").textContent=health.packets_stored??"—";
  document.querySelector("#frequency").textContent=health.frequency??"—";
  document.querySelector("#shown").textContent=data.count??0;
  const rows=data.packets||[];
  const pts=rows.map(p=>{const x=position(p.payload);return x?{...x,call:p.from_callsign}:null}).filter(Boolean);
  document.querySelector("#positions").textContent=pts.length;
  document.querySelector("#last").textContent=rows.length?fmtTime(rows[0].received_at):"None";
  setMarkers(pts);
  document.querySelector("#packets").innerHTML=rows.length?rows.map(p=>`<tr><td>${escapeHtml(fmtTime(p.received_at))}</td><td>${escapeHtml(p.from_callsign)}</td><td>${escapeHtml(p.to_callsign||"")}</td><td>${escapeHtml(p.path||"")}</td><td class="payload">${escapeHtml(p.payload)}</td></tr>`).join(""):'<tr><td colspan="5">No packets received yet.</td></tr>';
 }catch(e){
  document.querySelector("#dot").className="dot";
  document.querySelector("#status").textContent="API unavailable";
 }
}
document.querySelector("#refresh").addEventListener("click",load);
load();
setInterval(load,5000);
</script>
</body>
</html>
