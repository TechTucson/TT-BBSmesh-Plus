<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT WSPR Monitor</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101418;color:#e8edf2}header,main{padding:18px 24px;max-width:1500px;margin:auto}header{max-width:none;background:#171c21;border-bottom:1px solid #2a323a}h1{margin:0;font-size:1.35rem}.sub,.label,footer{color:#9ca8b3}.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.card{background:#171c21;border:1px solid #2a323a;border-radius:8px;padding:10px 14px;min-width:145px}.label{font-size:.76rem}.value{font-size:1.1rem;font-weight:600;margin-top:3px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777}.live{background:#35c46a}.error{background:#d75452}.table-wrap{overflow:auto;background:#171c21;border:1px solid #2a323a;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #252c33;font: .82rem ui-monospace,monospace}th{color:#9ca8b3;font-size:.76rem}button{background:#252d35;color:#e8edf2;border:1px solid #3a4650;border-radius:5px;padding:7px 11px;cursor:pointer}footer{font-size:.78rem;margin-top:10px}
</style></head><body><header><h1>📻 TT WSPR Monitor</h1><div class="sub"><span id="dot" class="dot"></span> <span id="status">Connecting…</span></div></header><main>
<section class="cards"><div class="card"><div class="label">Spots stored</div><div id="total" class="value">—</div></div><div class="card"><div class="label">Showing</div><div id="shown" class="value">—</div></div><div class="card"><div class="label">Receiver frequency</div><div id="frequency" class="value">—</div></div><div class="card"><div class="label">Last decode</div><div id="decoded" class="value">—</div></div><button id="refresh">Refresh</button></section>
<div class="table-wrap"><table><thead><tr><th>UTC</th><th>Callsign</th><th>Locator</th><th>Frequency (MHz)</th><th>SNR</th><th>DT</th><th>Drift</th><th>Power (dBm)</th></tr></thead><tbody id="spots"><tr><td colspan="8">Loading…</td></tr></tbody></table></div><footer>Auto-refresh: 15 seconds · Receive-only local WSPR monitor · No WSPRnet upload</footer></main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{const d=new Date(v);return Number.isNaN(d)?v:d.toLocaleString()};
async function load(){try{const [health,data]=await Promise.all([fetch('/api/health',{cache:'no-store'}).then(r=>r.json()),fetch('/api/spots?limit=100',{cache:'no-store'}).then(r=>r.json())]);$('#dot').className='dot '+(health.last_error?'error':'live');$('#status').textContent=health.last_error?'Decoder error: '+health.last_error:'LIVE';$('#total').textContent=health.spots_stored??'—';$('#shown').textContent=data.count??0;$('#frequency').textContent=health.frequency??'—';$('#decoded').textContent=health.last_decode_at?fmt(health.last_decode_at):'Waiting';const rows=data.spots||[];$('#spots').innerHTML=rows.length?rows.map(s=>`<tr><td>${esc(fmt(s.spot_time))}</td><td>${esc(s.callsign)}</td><td>${esc(s.locator)}</td><td>${esc(s.frequency.toFixed(6))}</td><td>${esc(s.snr)}</td><td>${esc(s.dt)}</td><td>${esc(s.drift)}</td><td>${esc(s.power)}</td></tr>`).join(''):'<tr><td colspan="8">No spots decoded yet.</td></tr>'}catch(error){$('#dot').className='dot error';$('#status').textContent='API unavailable'}}$('#refresh').addEventListener('click',load);load();setInterval(load,15000);
</script></body></html>
